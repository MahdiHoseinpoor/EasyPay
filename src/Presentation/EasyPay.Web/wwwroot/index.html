<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyPay.Web</title>
    <base href="/" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="css/app.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="EasyPay.Web.styles.css" rel="stylesheet" />
    <link href="css/loading.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="background-glows"></div>
    <div id="app">
        <div class="blazor-loading-container">
            <div class="blazor-loader"></div>
            <div class="blazor-loader-text">Loading...</div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script>
        window.showModal = (id) => {
            const modalElement = document.getElementById(id);
            if (modalElement) {
                const modal = new bootstrap.Modal(modalElement);
                modal.show();
            }
        };
        window.addEventListener('error', e => {
            console.error('window.onerror', e.error || e.message, e);
        });
        window.addEventListener('unhandledrejection', e => {
            console.error('unhandledrejection', e.reason);
        });

    </script>
</body>

</html>
