<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPay - Error</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* --- Shared Error Page Styles --- */
        :root {
            --bg-color: #0d0d0d;
            --surface-glass: rgba(25, 27, 46, 0.5);
            --primary-glow: #00ffe0;
            --secondary-glow: #ff007f;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --border-glass: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 1% 1%, var(--secondary-glow), transparent 25%), radial-gradient(circle at 99% 99%, var(--primary-glow), transparent 25%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
        }

        .error-page-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .glass-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: var(--primary-glow);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-glow {
            border-radius: 8px;
            border: 1px solid var(--primary-glow);
            background-color: transparent;
            color: var(--primary-glow);
            transition: all 0.2s ease-in-out;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-glow:hover, .btn-glow:focus {
            background-color: var(--primary-glow);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--primary-glow);
        }
    </style>
</head>
<body>
