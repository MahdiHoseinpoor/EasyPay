<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPay - Transaction History</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* --- Base Theme & App Layout (Reused) --- */
        :root { --bg-color: #0d0d0d; --surface-glass: rgba(25, 27, 46, 0.5); --primary-glow: #00ffe0; --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border-glass: rgba(255, 255, 255, 0.15); --success-color: #4caf50; }
        body { background-color: var(--bg-color); font-family: 'Inter', sans-serif; color: var(--text-primary); }
        h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
        .glass-panel { background: var(--surface-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); border-radius: 16px; }
        .app-wrapper { display: flex; min-height: 100vh; }
        /* Sidebar, Content Wrapper, Topbar styles reused */

        /* --- Transaction History Specific Styles --- */
        .form-control-cyber, .form-select-cyber { background-color: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-glass); color: var(--text-primary); }
        .form-control-cyber:focus, .form-select-cyber:focus { border-color: var(--primary-glow); box-shadow: 0 0 10px -2px var(--primary-glow); }
        .transaction-header { font-size: 0.9rem; color: var(--text-secondary); padding: 0.75rem; border-bottom: 2px solid var(--border-glass); }
        .transaction-row { border-bottom: 1px solid var(--border-glass); cursor: pointer; transition: background-color 0.2s ease; }
        .transaction-row:last-child { border-bottom: none; }
        .transaction-row:hover { background-color: rgba(0, 255, 224, 0.05); }
        .modal-content { border-radius: 16px; border: 1px solid var(--border-glass); }
        .modal-header, .modal-footer { border-color: var(--border-glass); }
        dt { color: var(--text-secondary); }
        dd { color: var(--text-primary); }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar glass-panel d-flex flex-column" id="appSidebar"><!-- Reused --></nav>
    
    <div class="content-wrapper">
        <!-- Topbar -->
        <header class="topbar glass-panel d-flex align-items-center justify-content-between rounded-3 mb-4"><!-- Reused --></header>

        <!-- Main Content -->
        <main class="main-content">
            <h1 class="h2 mb-4">Transaction History</h1>

            <!-- Filter Panel -->
            <div class="glass-panel p-3 mb-4">
                <div class="row g-2 align-items-end">
                    <div class="col-lg-3"><label class="form-label small">Search</label><input type="text" id="search-filter" class="form-control form-control-cyber" placeholder="Search..."></div>
                    <div class="col-lg-3"><label class="form-label small">Account</label><select id="account-filter" class="form-select form-select-cyber"></select></div>
                    <div class="col-lg-2"><label class="form-label small">Type</label><select id="type-filter" class="form-select form-select-cyber"><option value="all">All</option><option value="incoming">Incoming</option><option value="outgoing">Outgoing</option></select></div>
                    <div class="col-lg-2"><label class="form-label small">Date Range</label><select id="date-filter" class="form-select form-select-cyber"><option value="all">All Time</option><option value="7">Last 7 Days</option><option value="30">Last 30 Days</option></select></div>
                    <div class="col-lg-2"><a href="#" class="btn btn-outline-light w-100"><i class="bi bi-download me-2"></i>Export</a></div>
                </div>
            </div>

            <!-- Transaction List Panel -->
            <div class="glass-panel">
                <div class="transaction-header row d-none d-lg-flex">
                    <div class="col-lg-3">DATE</div>
                    <div class="col-lg-4">DESCRIPTION</div>
                    <div class="col-lg-3">ACCOUNT</div>
                    <div class="col-lg-2 text-end">AMOUNT(USD)</div>
                </div>
                <div id="transaction-list">
                    <!-- JS renders transactions here -->
                </div>
                <div class="p-3 text-center">
                    <button id="load-more-btn" class="btn btn-outline-secondary">Load More</button>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Transaction Detail Modal -->
<div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h5 class="modal-title" id="detailsModalLabel">Transaction Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="modal-body-content">
        <!-- JS populates details here -->
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    // --- MOCK DATA ---
    const mockAccounts = { 'acc_1': 'Personal Savings', 'acc_2': 'Business Account' };
    const mockTransactions = Array.from({ length: 50 }, (_, i) => {
        const isIncoming = Math.random() > 0.7;
        const amount = (Math.random() * (isIncoming ? 500 : 150)).toFixed(2);
        const date = new Date();
        date.setDate(date.getDate() - i * Math.random() * 3);
        const merchants = ['Coffee Shop', 'Amazon Purchase', 'Utility Bill', 'Paycheck Deposit', 'Incoming Transfer', 'Spotify Subscription'];
        return {
            id: `txn_${Math.random().toString(36).substr(2, 9)}`,
            date: date.toISOString(),
            description: merchants[Math.floor(Math.random() * merchants.length)],
            account: i % 2 === 0 ? 'acc_1' : 'acc_2',
            type: isIncoming ? 'incoming' : 'outgoing',
            amount: parseFloat(amount),
            status: 'Completed',
            category: 'General'
        };
    });

    // --- DOM ELEMENTS ---
    const listContainer = document.getElementById('transaction-list');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const filters = {
        search: document.getElementById('search-filter'),
        account: document.getElementById('account-filter'),
        type: document.getElementById('type-filter'),
        date: document.getElementById('date-filter'),
    };
    const detailsModal = new bootstrap.Modal(document.getElementById('detailsModal'));

    let currentPage = 1;
    const ITEMS_PER_PAGE = 10;

    // --- SETUP ---
    function setup() {
        // Populate account filter
        let accountOptions = '<option value="all">All Accounts</option>';
        for (const [id, name] of Object.entries(mockAccounts)) {
            accountOptions += `<option value="${id}">${name}</option>`;
        }
        filters.account.innerHTML = accountOptions;

        // Add event listeners to all filters
        Object.values(filters).forEach(filter => filter.addEventListener('change', () => {
            currentPage = 1; // Reset on filter change
            renderTransactions();
        }));
        filters.search.addEventListener('input', () => {
             currentPage = 1;
             renderTransactions();
        });
        loadMoreBtn.addEventListener('click', () => {
            currentPage++;
            renderTransactions(true); // 'true' to append
        });
    }

    // --- RENDER & FILTER LOGIC ---
    function renderTransactions(append = false) {
        // 1. Get filter values
        const searchTerm = filters.search.value.toLowerCase();
        const accountId = filters.account.value;
        const type = filters.type.value;
        const dateRange = parseInt(filters.date.value, 10);

        // 2. Filter data
        const dateLimit = new Date();
        if (dateRange) dateLimit.setDate(dateLimit.getDate() - dateRange);

        const filtered = mockTransactions.filter(t => {
            const tDate = new Date(t.date);
            return (
                (t.description.toLowerCase().includes(searchTerm)) &&
                (accountId === 'all' || t.account === accountId) &&
                (type === 'all' || t.type === type) &&
                (isNaN(dateRange) || tDate >= dateLimit)
            );
        });
        
        // 3. Paginate
        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const end = start + ITEMS_PER_PAGE;
        const paginated = filtered.slice(0, end); // Always get all items up to the current page end

        loadMoreBtn.style.display = filtered.length > paginated.length ? 'block' : 'none';

        // 4. Generate HTML
        let html = paginated.map(t => {
            const isIncoming = t.type === 'incoming';
            return `
            <div class="transaction-row p-3" data-id="${t.id}">
                <div class="row align-items-center">
                    <div class="col-6 col-lg-3">
                        ${new Date(t.date).toLocaleDateString("en-US", { month: 'short', day: 'numeric', year: 'numeric' })}
                    </div>
                    <div class="col-6 col-lg-4 text-end text-lg-start">
                        <div class="fw-bold">${t.description}</div>
                        <small class="text-secondary d-lg-none">${mockAccounts[t.account]}</small>
                    </div>
                    <div class="col-lg-3 d-none d-lg-block text-secondary">${mockAccounts[t.account]}</div>
                    <div class="col-12 col-lg-2 text-end fw-bold mt-1 mt-lg-0 ${isIncoming ? 'text-success' : ''}">
                        ${isIncoming ? '+' : '-'} $${t.amount.toFixed(2)}
                    </div>
                </div>
            </div>`;
        }).join('');
        
        listContainer.innerHTML = html; // Replace content completely to show new paginated set

        // 5. Add click listeners
        listContainer.querySelectorAll('.transaction-row').forEach(row => {
            row.addEventListener('click', () => showDetails(row.dataset.id));
        });
    }
    
    // --- MODAL LOGIC ---
    function showDetails(transactionId) {
        const t = mockTransactions.find(txn => txn.id === transactionId);
        if (!t) return;
        
        const content = `
            <dl class="row">
                <dt class="col-sm-5">Amount</dt>
                <dd class="col-sm-7 fs-5 fw-bold ${t.type === 'incoming' ? 'text-success' : ''}">${t.type === 'incoming' ? '+' : '-'} $${t.amount.toFixed(2)}</dd>
                
                <dt class="col-sm-5">Description</dt>
                <dd class="col-sm-7">${t.description}</dd>

                <dt class="col-sm-5">Date & Time</dt>
                <dd class="col-sm-7">${new Date(t.date).toLocaleString()}</dd>
                
                <dt class="col-sm-5">Account</dt>
                <dd class="col-sm-7">${mockAccounts[t.account]}</dd>
                
                <dt class="col-sm-5">Status</dt>
                <dd class="col-sm-7"><span class="badge bg-success">${t.status}</span></dd>
                
                <dt class="col-sm-5">Transaction ID</dt>
                <dd class="col-sm-7 text-secondary"><small>${t.id}</small></dd>
            </dl>
        `;
        document.getElementById('modal-body-content').innerHTML = content;
        detailsModal.show();
    }

    // --- INITIALIZE ---
    setup();
    renderTransactions();
});
</script>
</body>
</html>
