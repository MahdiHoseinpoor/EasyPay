<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPay - Bills Management</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* --- Base Theme & App Layout (Reused) --- */
        :root { --bg-color: #0d0d0d; --surface-glass: rgba(25, 27, 46, 0.5); --primary-glow: #00ffe0; --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border-glass: rgba(255, 255, 255, 0.15); --warning-color: #ffb300; }
        body { background-color: var(--bg-color); font-family: 'Inter', sans-serif; color: var(--text-primary); }
        h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
        .glass-panel { background: var(--surface-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); border-radius: 16px; }
        .app-wrapper { display: flex; min-height: 100vh; }
        .sidebar { /* Reused styles */ }
        .content-wrapper { flex-grow: 1; padding: 1rem; }
        /* --- Bill Management Specific Styles --- */
        .bill-card { display: flex; flex-direction: column; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .bill-card:hover { transform: translateY(-5px); box-shadow: 0 0 15px -3px var(--primary-glow); }
        .btn-glow { border-radius: 8px; border: 1px solid var(--primary-glow); color: var(--primary-glow); transition: all 0.2s ease; }
        .btn-glow:hover { background-color: var(--primary-glow); color: var(--bg-color); box-shadow: 0 0 15px var(--primary-glow); }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar glass-panel d-flex flex-column" id="appSidebar">
        <!-- Re-used sidebar content -->
    </nav>
    
    <div class="content-wrapper">
        <!-- Topbar -->
        <header class="topbar glass-panel d-flex align-items-center justify-content-between rounded-3 mb-4">
            <!-- Re-used topbar content -->
        </header>

        <!-- Main Content: Bills Management -->
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2">Bills Management</h1>
                <a href="/bills/add.html" class="btn btn-glow"><i class="bi bi-plus-lg me-2"></i>Add New Bill</a>
            </div>

            <!-- Bill Cards Grid -->
            <div class="row">
                <!-- Bill Card 1: Utility -->
                <div class="col-lg-6 col-xl-4 mb-4">
                    <div class="bill-card glass-panel p-4 h-100">
                        <div class="d-flex justify-content-between align-items-start">
                             <div>
                                <i class="bi bi-lightning-charge-fill fs-2" style="color: var(--primary-glow)"></i>
                                <h5 class="mt-2 mb-0">City Power</h5>
                                <small class="text-secondary">Utility Bill</small>
                             </div>
                             <span class="badge text-bg-warning">Due Soon</span>
                        </div>
                        <div class="text-center my-4">
                            <small class="text-secondary">Amount Due</small>
                            <p class="display-5 fw-bold">$85.20</p>
                            <small class="text-secondary">Due by Feb 01, 2024</small>
                        </div>
                        <div class="d-grid gap-2 mt-auto">
                            <button class="btn btn-glow" onclick="payBill('City Power', '85.20')">Pay Bill</button>
                            <button class="btn btn-outline-secondary">Update Amount</button>
                        </div>
                    </div>
                </div>

                <!-- Bill Card 2: Mobile -->
                <div class="col-lg-6 col-xl-4 mb-4">
                    <div class="bill-card glass-panel p-4 h-100">
                        <div class="d-flex justify-content-between align-items-start">
                             <div>
                                <i class="bi bi-phone-fill fs-2" style="color: var(--primary-glow)"></i>
                                <h5 class="mt-2 mb-0">Verizon Mobile</h5>
                                <small class="text-secondary">Mobile Bill</small>
                             </div>
                             <span class="badge text-bg-success">Paid</span>
                        </div>
                        <div class="text-center my-4">
                            <small class="text-secondary">Last Paid</small>
                            <p class="display-5 fw-bold">$65.00</p>
                            <small class="text-secondary">on Jan 15, 2024</small>
                        </div>
                        <div class="d-grid gap-2 mt-auto">
                            <button class="btn btn-glow" disabled>Pay Bill</button>
                            <button class="btn btn-outline-secondary">Check for New Bill</button>
                        </div>
                    </div>
                </div>

                <!-- Empty State Card (Uncomment to view) -->
                <!-- 
                <div class="col-12">
                    <div class="text-center p-5 glass-panel">
                        <i class="bi bi-receipt-cutoff fs-1"></i>
                        <h3 class="mt-3">No bills found</h3>
                        <p class="text-secondary">Get started by adding your first utility, phone, or internet bill.</p>
                        <a href="/bills/add.html" class="btn btn-glow mt-3">Add Your First Bill</a>
                    </div>
                </div>
                 -->
            </div>
        </main>
    </div>
</div>
<script>
    function payBill(billName, amount) {
        if (confirm(`Are you sure you want to pay $${amount} for your ${billName} bill?`)) {
            alert('Payment Successful!');
            // In a real app, this would trigger an API call.
        }
    }
</script>
</body>
</html>
