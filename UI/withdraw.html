<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPay - Withdraw Funds</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* --- Base Theme & App Layout (Reused) --- */
        :root { --bg-color: #0d0d0d; --surface-glass: rgba(25, 27, 46, 0.5); --primary-glow: #00ffe0; --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border-glass: rgba(255, 255, 255, 0.15); }
        body { background-color: var(--bg-color); font-family: 'Inter', sans-serif; color: var(--text-primary); background-attachment: fixed; }
        h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; font-weight: 700; }
        .glass-panel { background: var(--surface-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); }
        .app-wrapper { display: flex; min-height: 100vh; }
        .sidebar, .topbar { /* Reused styles */ }
        .content-wrapper { flex-grow: 1; padding: 1rem; display: flex; flex-direction: column; }
        .main-content { flex-grow: 1; }
        
        /* Custom form styles for this page */
        .form-control-cyber { background-color: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-glass); color: var(--text-primary); }
        .form-control-cyber:focus { background-color: rgba(0, 0, 0, 0.3); border-color: var(--primary-glow); box-shadow: 0 0 10px -2px var(--primary-glow); }
        .saved-card { border: 1px solid var(--border-glass); border-radius: 8px; cursor: pointer; transition: border-color 0.2s; }
        .saved-card:hover { border-color: var(--text-secondary); }
        .saved-card.selected { border-color: var(--primary-glow); box-shadow: 0 0 10px -2px var(--primary-glow); }
        .btn-glow { /* Reused style */ border-radius: 8px; border: 1px solid var(--primary-glow); background-color: transparent; color: var(--primary-glow); transition: all 0.2s ease-in-out; }
        .btn-glow:hover { background-color: var(--primary-glow); color: var(--bg-color); box-shadow: 0 0 15px var(--primary-glow); }
        .btn-glow:disabled { border-color: var(--text-secondary); color: var(--text-secondary); opacity: 0.5; }
        .btn-glow:disabled:hover{ background-color: transparent; box-shadow: none; }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar glass-panel d-flex flex-column" id="appSidebar">
        <!-- Re-used sidebar content -->
    </nav>
    
    <div class="content-wrapper">
        <!-- Topbar -->
        <header class="topbar glass-panel d-flex align-items-center justify-content-between rounded-3 mb-4">
            <!-- Re-used topbar content -->
        </header>

        <!-- Main Content: Withdraw Form -->
        <main class="main-content d-flex flex-column align-items-center justify-content-center">
            <div class="w-100" style="max-width: 600px;">
                <div class="glass-panel p-4 p-md-5 rounded-4">
                    <h1 class="h2 text-center mb-4">Withdraw Funds</h1>
                    <form id="withdraw-form">
                        <!-- Source Account -->
                        <div class="mb-4 text-center">
                           <label class="form-label text-secondary">From Account</label>
                           <p class="fs-4 mb-0">Personal Savings</p>
                           <strong style="color: var(--primary-glow);">$1,250.50 <span class="text-secondary">USD</span></strong>
                        </div>
                        
                        <!-- Saved Cards Selector -->
                        <div class="mb-4">
                           <label class="form-label">Select Destination</label>
                           <div class="saved-card p-3 d-flex align-items-center" data-card-id="card1">
                                <input type="radio" class="form-check-input me-3" name="destinationCard" id="card1" value="card1" style="transform: scale(1.5);">
                                <i class="bi bi-credit-card-2-front-fill fs-2 me-3"></i>
                                <div>
                                    <label for="card1" class="form-check-label fw-bold">Visa Debit</label>
                                    <p class="mb-0 text-secondary">**** **** **** 4242</p>
                                </div>
                           </div>
                        </div>

                        <!-- Amount Input -->
                        <div class="mb-3">
                            <label for="withdrawAmount" class="form-label">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text form-control-cyber">$</span>
                                <input type="number" class="form-control form-control-cyber" id="withdrawAmount" placeholder="0.00" step="0.01" required>
                            </div>
                        </div>

                        <!-- Fees Summary -->
                        <div class="p-3 rounded-3 mb-4" style="background-color: rgba(0,0,0,0.2);">
                            <div class="d-flex justify-content-between text-secondary">
                                <span>Processing Fee (1.5%):</span>
                                <span id="fee-amount">$0.00</span>
                            </div>
                            <hr style="border-color: var(--border-glass);">
                            <div class="d-flex justify-content-between fw-bold fs-5">
                                <span>You will receive:</span>
                                <span id="total-received">$0.00</span>
                            </div>
                        </div>

                        <!-- CTA Button -->
                        <div class="d-grid">
                            <button type="submit" id="withdraw-btn" class="btn btn-glow btn-lg" disabled>Withdraw</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

        const amountInput = document.getElementById('withdrawAmount');
        const feeDisplay = document.getElementById('fee-amount');
        const totalDisplay = document.getElementById('total-received');
