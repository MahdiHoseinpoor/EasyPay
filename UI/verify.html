<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPay - Secure Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* --- Base Theme & Form Styles (Reused from Auth page) --- */
        :root { --bg-color: #0d0d0d; --surface-glass: rgba(25, 27, 46, 0.5); --primary-glow: #00ffe0; --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border-glass: rgba(255, 255, 255, 0.15); }
        body { background-color: var(--bg-color); background-image: radial-gradient(circle at 1% 1%, var(--secondary-glow, #ff007f), transparent 25%), radial-gradient(circle at 99% 99%, var(--primary-glow), transparent 25%); background-attachment: fixed; color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; font-weight: 700; }
        .glass-panel { background: var(--surface-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid var(--border-glass); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        .form-control-cyber { background-color: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-glass); color: var(--text-primary); border-radius: 8px; }
        .form-control-cyber:focus { background-color: rgba(0, 0, 0, 0.3); color: var(--text-primary); border-color: var(--primary-glow); box-shadow: 0 0 10px -2px var(--primary-glow); }
        .btn-glow { border-radius: 8px; border: 1px solid var(--primary-glow); background-color: transparent; color: var(--primary-glow); transition: all 0.2s ease-in-out; padding: 0.75rem 1.5rem; font-weight: 600; }
        .btn-glow:hover, .btn-glow:focus { background-color: var(--primary-glow); color: var(--bg-color); box-shadow: 0 0 25px var(--primary-glow); }
        .btn-link-cyber { color: var(--text-secondary); text-decoration: none; }
        .btn-link-cyber:hover { color: var(--primary-glow); text-decoration: underline; }
    </style>
</head>
<body>
<main class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="row align-items-center w-100" style="max-width: 960px;">
        <!-- Left Column: Visual/Branding (Hidden on mobile) -->
        <div class="col-lg-6 d-none d-lg-block text-center text-lg-start pe-lg-5">
             <i class="bi bi-shield-lock-fill fs-1" style="color: var(--primary-glow);"></i>
            <h1 class="display-4 mt-2">Final Step</h1>
            <p class="lead text-secondary mt-3">Welcome back! Please enter your password to securely access your account.</p>
        </div>

        <!-- Right Column: Auth Form -->
        <div class="col-lg-6 col-md-12">
            <div class="glass-panel p-4 p-sm-5">
                <h2 class="text-center mb-1">Secure Login</h2>
                <p class="text-center text-secondary mb-4">for +1 555 123 4567</p>
                
                <form id="login-form">
                    <!-- Password Field -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-cyber" id="password" required>
                    </div>

                    <!-- 2FA Field (can be shown conditionally) -->
                    <div class="mb-3">
                        <label for="2fa-code" class="form-label">Authenticator Code (2FA)</label>
                        <input type="text" class="form-control form-control-cyber text-center" id="2fa-code" inputmode="numeric" placeholder="_ _ _ _ _ _" maxlength="6">
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="rememberDevice">
                            <label class="form-check-label" for="rememberDevice">
                                Remember device
                            </label>
                        </div>
                        <a href="#" class="btn-link-cyber small">Forgot Password?</a>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-glow">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
