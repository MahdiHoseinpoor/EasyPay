<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPay - Add New Card</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* --- Reused Theme & Form Styles --- */
        :root { /* Reused color variables */ }
        body { background-color: #0d0d0d; font-family: 'Inter', sans-serif; color: #f0f0f0; }
        .glass-panel { background: rgba(25, 27, 46, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; }
        .form-control-cyber { background-color: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.15); color: #f0f0f0; }
        .form-control-cyber:focus { background-color: rgba(0, 0, 0, 0.3); border-color: #00ffe0; box-shadow: 0 0 10px -2px #00ffe0; }
        .form-control-cyber.is-invalid { border-color: #ff5252; }
        .btn-glow { /* Reused styles */ }
    </style>
</head>
<body>
<div class="d-flex flex-column min-vh-100">
    <header class="p-3"><a href="/settings/cards.html" class="btn btn-outline-light"><i class="bi bi-arrow-left me-2"></i>Back to Saved Cards</a></header>
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="w-100" style="max-width: 600px;">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-credit-card-2-front-fill fs-1" style="color: #00ffe0;"></i>
                    <h1 class="h2 mt-2">Add a New Card</h1>
                    <p class="text-secondary">This card can be used for future withdrawals.</p>
                </div>
                <form id="add-card-form" novalidate>
                    <div class="mb-3">
                        <label for="cardTitle" class="form-label">Card Nickname (Title)</label>
                        <input type="text" class="form-control form-control-cyber" id="cardTitle" placeholder="e.g., My Visa Debit" required>
                    </div>
                    <div class="mb-3">
                        <label for="cardNumber" class="form-label">Card Number</label>
                        <div class="position-relative">
                           <input type="text" class="form-control form-control-cyber" id="cardNumber" placeholder="0000 0000 0000 0000" required inputmode="numeric">
                           <i id="card-type-icon" class="bi bi-credit-card fs-4 position-absolute" style="top: 50%; right: 1rem; transform: translateY(-50%);"></i>
                        </div>
                        <div id="card-number-error" class="invalid-feedback">Please enter a valid card number.</div>
                    </div>
                    <div class="mb-3">
                        <label for="accountNumber" class="form-label">Bank Account Number (Optional)</label>
                        <input type="text" class="form-control form-control-cyber" id="accountNumber" placeholder="Associated bank account number">
                    </div>
                    <div class="mb-4">
                        <label for="iban" class="form-label">IBAN (Optional)</label>
                        <input type="text" class="form-control form-control-cyber" id="iban" placeholder="International Bank Account Number">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-glow btn-lg" disabled>Save Card</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('add-card-form');
    const cardTitle = document.getElementById('cardTitle');
    const cardNumberInput = document.getElementById('cardNumber');
    const cardIcon = document.getElementById('card-type-icon');
    constcardNumberError = document.getElementById('card-number-error');
    const submitBtn = form.querySelector('button[type="submit"]');

    function validateLuhn(cardNumber) {
        let s = cardNumber.replace(/\D/g, '');
        if (!s.length || s.length < 13) return false;
        return s.split('').reverse().map(Number).map((d, i) => i % 2 === 1 ? (d * 2 > 9 ? d * 2 - 9 : d * 2) : d).reduce((a, b) => a + b) % 10 === 0;
    }

    function validateForm() {
        const isTitleValid = cardTitle.value.trim() !== '';
        const isCardNumberValid = validateLuhn(cardNumberInput.value);
        
        if (isCardNumberValid) {
            cardNumberInput.classList.remove('is-invalid');
        } else if (cardNumberInput.value.length > 0) {
            cardNumberInput.classList.add('is-invalid');
        } else {
             cardNumberInput.classList.remove('is-invalid');
        }

        submitBtn.disabled = !(isTitleValid && isCardNumberValid);
    }

    cardNumberInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '').substring(0, 16);
        value = value.replace(/(\d{4})/g, '$1 ').trim();
        e.target.value = value;
        
        // Card type detection
        if (/^4/.test(value)) {
            cardIcon.className = 'bi bi-visa fs-4 position-absolute';
        } else if (/^5[1-5]/.test(value)) {
            cardIcon.className = 'bi bi-mastercard fs-4 position-absolute';
        } else {
            cardIcon.className = 'bi bi-credit-card fs-4 position-absolute';
        }
        validateForm();
    });
    
    cardTitle.addEventListener('input', validateForm);

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (validateLuhn(cardNumberInput.value) && cardTitle.value.trim() !== '') {
            alert('Card saved successfully!');
            window.location.href = '/settings/cards.html';
        }
    });
});
</script>
</body>
</html>
