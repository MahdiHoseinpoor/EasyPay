<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPay - Add New Bill</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* --- Reused Theme & Form Styles --- */
        :root { --bg-color: #0d0d0d; --surface-glass: rgba(25, 27, 46, 0.5); --primary-glow: #00ffe0; --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border-glass: rgba(255, 255, 255, 0.15); }
        body { background-color: var(--bg-color); font-family: 'Inter', sans-serif; color: var(--text-primary); }
        h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
        .glass-panel { background: var(--surface-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); border-radius: 16px; }
        .form-control-cyber, .form-select-cyber { background-color: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-glass); color: var(--text-primary); }
        .form-control-cyber:focus, .form-select-cyber:focus { background-color: rgba(0, 0, 0, 0.3); border-color: var(--primary-glow); box-shadow: 0 0 10px -2px var(--primary-glow); }
        .btn-glow { border-radius: 8px; border: 1px solid var(--primary-glow); color: var(--primary-glow); transition: all 0.2s ease; }
        .btn-glow:hover { background-color: var(--primary-glow); color: var(--bg-color); box-shadow: 0 0 15px var(--primary-glow); }
        .btn-glow:disabled { border-color: var(--text-secondary); color: var(--text-secondary); opacity: 0.5; }
    </style>
</head>
<body>
<div class="app-wrapper d-flex flex-column min-vh-100">
    <!-- Simplified header for a focused task -->
    <header class="p-3">
        <a href="/bills.html" class="btn btn-outline-light"><i class="bi bi-arrow-left me-2"></i>Back to Bills</a>
    </header>

    <!-- Main Content: Centered Add Bill Form -->
    <main class="main-content flex-grow-1 d-flex flex-column align-items-center justify-content-center">
        <div class="w-100" style="max-width: 600px;">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-receipt-cutoff fs-1" style="color: var(--primary-glow);"></i>
                    <h1 class="h2 mt-2">Add a New Bill</h1>
                    <p class="text-secondary">Link a new bill to manage and pay it directly from EasyPay.</p>
                </div>
                
                <form id="add-bill-form">
                    <div class="mb-3">
                        <label for="billName" class="form-label">Nickname</label>
                        <input type="text" class="form-control form-control-cyber" id="billName" placeholder="e.g., Home Internet" required>
                    </div>
                    <div class="mb-3">
                        <label for="billType" class="form-label">Bill Type</label>
                        <select class="form-select form-select-cyber" id="billType" required>
                            <option value="" selected disabled>Select a type...</option>
                            <option value="utility">Utility (Water, Gas, Electric)</option>
                            <option value="mobile">Mobile Phone</option>
                            <option value="internet">Internet / TV</option>
                            <option value="subscription">Subscription Service</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="billIdentifier" id="identifierLabel" class="form-label">Account Number</label>
                        <input type="text" class="form-control form-control-cyber" id="billIdentifier" placeholder="Enter the account number from your bill" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-glow btn-lg" disabled>Find & Save Bill</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('add-bill-form');
    const billTypeSelect = document.getElementById('billType');
    const identifierLabel = document.getElementById('identifierLabel');
    const identifierInput = document.getElementById('billIdentifier');
    const submitBtn = form.querySelector('button[type="submit"]');

    // --- Dynamic Form Label Logic ---
    billTypeSelect.addEventListener('change', function() {
        const type = this.value;
        switch(type) {
            case 'mobile':
                identifierLabel.textContent = 'Phone Number';
                identifierInput.placeholder = 'Enter the mobile number';
                identifierInput.type = 'tel';
                break;
            case 'internet':
                identifierLabel.textContent = 'Account or Service ID';
                identifierInput.placeholder = 'Enter your service identifier';
                identifierInput.type = 'text';
                break;
            case 'subscription':
                 identifierLabel.textContent = 'Subscription ID or Email';
                identifierInput.placeholder = 'Enter your user/subscription ID';
                identifierInput.type = 'text';
                break;
            case 'utility':
            default:
                identifierLabel.textContent = 'Account Number';
                identifierInput.placeholder = 'Enter the account number from your bill';
                identifierInput.type = 'text';
                break;
        }
        validateForm();
    });

    // --- Simple Form Validation for CTA ---
    function validateForm() {
        const isNameFilled = document.getElementById('billName').value.trim() !== '';
        const isTypeSelected = billTypeSelect.value !== '';
        const isIdentifierFilled = identifierInput.value.trim() !== '';
        submitBtn.disabled = !(isNameFilled && isTypeSelected && isIdentifierFilled);
    }
    form.addEventListener('input', validateForm);

    // --- Form Submission ---
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Bill added successfully!');
        window.location.href = '/bills.html'; // Redirect back to the main bills page
    });
});
</script>
</body>
</html>
