<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPay - Complete Your Profile</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* --- Base Theme & App Layout (Reused) --- */
        :root { --bg-color: #0d0d0d; --surface-glass: rgba(25, 27, 46, 0.5); --primary-glow: #00ffe0; --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border-glass: rgba(255, 255, 255, 0.15); }
        body { background-color: var(--bg-color); font-family: 'Inter', sans-serif; color: var(--text-primary); }
        h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
        .glass-panel { background: var(--surface-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); }
        .form-control-cyber { background-color: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-glass); color: var(--text-primary); }
        .form-control-cyber:focus { background-color: rgba(0, 0, 0, 0.3); border-color: var(--primary-glow); box-shadow: 0 0 10px -2px var(--primary-glow); }
        .btn-glow { /* Reused styles */ }
        .app-wrapper, .sidebar, .content-wrapper, .topbar { /* Reused styles */ }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar glass-panel d-flex flex-column" id="appSidebar">
        <!-- Re-used sidebar content -->
    </nav>
    
    <div class="content-wrapper">
        <!-- Topbar -->
        <header class="topbar glass-panel d-flex align-items-center justify-content-between rounded-3 mb-4">
            <!-- Re-used topbar content -->
        </header>

        <!-- Main Content: Profile Completion Form -->
        <main class="main-content d-flex flex-column align-items-center justify-content-center">
            <div class="w-100" style="max-width: 800px;">
                <div class="glass-panel p-4 p-md-5 rounded-4">
                    <div class="text-center">
                        <h1 class="h2">Complete Your Profile</h1>
                        <p class="text-secondary">This information is required to verify your identity and create your accounts.</p>
                    </div>

                    <!-- Progress Bar (Visual only) -->
                    <div class="progress my-4" style="height: 8px; background-color: rgba(0,0,0,0.3);">
                      <div class="progress-bar" role="progressbar" style="width: 50%; background-color: var(--primary-glow);" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>

                    <form id="profile-form">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control form-control-cyber" id="fullName" placeholder="e.g., Alex Example" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control form-control-cyber" id="dob" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Full Address</label>
                            <textarea class="form-control form-control-cyber" id="address" rows="3" placeholder="123 Cyber Street, Neon City, 10101" required></textarea>
                        </div>
                        <div class="mb-4">
                            <label for="nationalId" class="form-label">National ID</label>
                            <input type="text" class="form-control form-control-cyber" id="nationalId" placeholder="Enter your ID number" inputmode="numeric" required>
                        </div>

                        <!-- KYC Upload Placeholder -->
                        <div class="mb-4 p-4 text-center rounded-3" style="border: 2px dashed var(--border-glass);">
                            <i class="bi bi-file-earmark-arrow-up-fill fs-2"></i>
                            <h5 class="mt-2">Upload ID Document</h5>
                            <p class="text-secondary small">Upload a clear photo of your passport or national ID card. This helps us keep your account secure.</p>
                            <button type="button" class="btn btn-outline-light disabled">Upload File (UI Placeholder)</button>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-glow btn-lg">Save & Continue</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
